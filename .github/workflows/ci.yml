name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Detect what changed to determine which jobs to run
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE"..HEAD)

          code=false
          docs=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              src/*|tests/*|samples/*|*.props|*.sln|.github/workflows/*) code=true ;;
            esac
            case "$file" in
              *.md|docs/*) docs=true ;;
            esac
          done <<< "$CHANGED"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  # Lint markdown files
  markdownlint:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run markdownlint
        run: npx markdownlint-cli2 '**/*.md'

  build:
    needs: [changes, markdownlint]
    if: always() && needs.changes.outputs.code == 'true' && needs.markdownlint.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Authenticate GitHub Packages
        run: dotnet nuget update source github-richlander --username richlander --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --configfile nuget.config

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release -p:ExcludeAnsi=true --no-restore

      - name: Test
        run: |
          dotnet run --project tests/Markout.Tests -c Release -p:ExcludeAnsi=true
          dotnet run --project tests/Markout.Templates.Tests -c Release -p:ExcludeAnsi=true

      - name: Pack
        run: dotnet pack -c Release -p:ExcludeAnsi=true --no-build

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/package/release/*.nupkg

      - name: Run demos and validate with markdownlint
        run: |
          set -e
          demo=artifacts/bin/Markout.Demo/release/Markout.Demo
          
          # Get available demos dynamically (filter to just demo names)
          demos=$($demo | grep -E '^\s+\w+$' | tr -d ' ')
          echo "Available demos: $demos"
          
          # Run each demo and lint output
          for name in $demos; do
            echo "Running demo: $name"
            output="demo-${name}.md"
            $demo $name > "$output"
            markdownlint "$output"
          done
          
          echo "All demos passed markdownlint!"

      - name: Markout smoke tests
        run: |
          # Validate key content in demo outputs
          grep -q "# Altra Torin 7" demo-simple.md
          grep -q "| Category | Road |" demo-simple.md
          grep -q "## Specifications" demo-sections.md
          grep -q "## Available Models" demo-list.md
          grep -q "| Model | Category | Price | In Stock |" demo-table.md
          grep -q "### Torin 7" demo-nested.md
          grep -q "## Inventory by Size" demo-pivot.md
          grep -q "## Products with Reviews" demo-tree.md
          grep -q "## Shoe" demo-schema.md
          
          echo "Markout smoke tests passed!"
