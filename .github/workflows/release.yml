name: Publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI workflow run ID to publish from'
        required: true
      confirm:
        description: 'Type "publish" to confirm NuGet release'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'publish'
    permissions:
      id-token: write   # Required for NuGet trusted publishing (OIDC)
      actions: read      # Required to download artifacts from another run
    steps:
      - name: Download packages from CI run
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List packages
        run: ls -la packages/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (trusted publishing)
        uses: nuget/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: |
          for pkg in packages/*.nupkg; do
            name=$(basename "$pkg")
            case "$name" in
              Markout.[0-9]*)
                echo "Publishing: $name"
                dotnet nuget push "$pkg" \
                  --source https://api.nuget.org/v3/index.json \
                  --skip-duplicate
                ;;
              *)
                echo "Skipping: $name"
                ;;
            esac
          done
