          path: Program.cs
          value: '| ---'
      - type: run-command
        config:
          command: dotnet
          args:
            - run
            - --no-build
          expected_exit_code: 0
          stdout_matches: (?=[\s\S]*name\trole\tstatus)(?=[\s\S]*Ada\tLead\tActive)(?![\s\S]*\| Name \|)[\s\S]*
