  - name: "CT24: section-targeted verbosity backpressure (-D / -S)"
    prompt: |
      This console project references a source-generated .NET Markdown serializer (see the .csproj). Program.cs holds one plain PackageReport
      with scalar fields and two detail sections (Dependencies, Diagnostics), where Diagnostics is the
      deepest/most expensive detail. Using the serializer, print THREE reports from ONE model definition:
        1. a quiet report (title + scalars only, no detail sections);
        2. a report that targets ONLY the Diagnostics section by name — it must PROMOTE the effective
           verbosity so Diagnostics is collected, yet render Diagnostics and NOT Dependencies;
        3. a detailed report that includes both Dependencies and Diagnostics.
      Select the rendered sections at serialize time (IncludeSections). Do not hand-write omitted
      sections. Build and run to confirm.
    setup:
      files:
        - { path: Report.csproj, source: fixtures/ct/CT24/Report.csproj }
        - { path: Program.cs,    source: fixtures/ct/CT24/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin MarkoutSerializer.Serialize .", expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin IncludeSections .", expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "| ---" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: "(?=[\\s\\S]*transitive version conflict)(?=[\\s\\S]*## Diagnostics[\\s\\S]*## Diagnostics)^(?:(?!## Dependencies)[\\s\\S])*## Dependencies(?:(?!## Dependencies)[\\s\\S])*$"
        command_timeout: 120
    rubric:
      - "A section-targeted request renders ONLY the requested section while promoting verbosity to collect it"
      - "Diagnostics appears in both the targeted render and the detailed render (>= twice); Dependencies appears only in the detailed render (exactly once total)"
      - "Section selection uses IncludeSections; omitted sections are never hand-written"
    timeout: 1200
