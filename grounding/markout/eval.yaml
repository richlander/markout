      GitHub-flavored Markdown, then as plain text — ASCII, space-aligned columns, no pipe tables and no
      box-drawing characters (the library ships a dedicated plain-text formatter for exactly this). Do not
      hand-write either rendering or define two models. Build and run to confirm both are printed.
    setup:
      files:
        - { path: Report.csproj, source: fixtures/ct/CT05/Report.csproj }
        - { path: Program.cs,    source: fixtures/ct/CT05/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin MarkoutSerializer.Serialize .", expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin PlainTextFormatter .", expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "| ---" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: "(?=[\\s\\S]*# v2\\.4\\.0)(?=[\\s\\S]*Field {2,}Value)(?=[\\s\\S]*-{4,} +-{3,})(?=[\\s\\S]*\\| Commits \\| 87 \\|)[\\s\\S]*"
        command_timeout: 120
    rubric:
      - "Renders ONE model twice, passing a PlainTextFormatter for the second (ASCII, space-aligned) rendering"
      - "Markdown output uses '#'/pipe tables; plain-text output is space-aligned with ASCII rules (no pipe table, no Unicode box-drawing)"
      - "Drives both through the serializer; does NOT hand-write either format"
    timeout: 900

  - name: "CT06: description paragraph + inline field layout"
    prompt: |
      This console project references a source-generated .NET Markdown serializer (see the .csproj). Program.cs holds one plain Component
