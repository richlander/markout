# Markout — CT-24 workflow ladder (Markout 0.22.0)
#
# 24 workflow/user-problem scenarios that exercise the base "markout" skill plus five domain
# workflow skills. First 6 are the basics (floor); the remaining 18 rise in difficulty across
# the five domains (conditional-composition, multi-view-verbosity, output-formats,
# built-in-shapes, composite-cells-cards), four difficulty rounds A<B<C<D.
#
# DESIGN: each fixture ships a BARE domain model (plain POCOs) + populated data + a TODO. The
# agent authors ONLY the rendering (Markout attributes + serializer call). This isolates the
# declarative-idiom-vs-hand-roll choice.
#
# DUAL GRADING (a hand-roll and the idiom can emit identical bytes):
#   - CODE conformance: the declarative attribute under test is present (a hand-roller never
#     emits it), output is driven through MarkoutSerializer.Serialize, and the source contains
#     no hand-written Markdown table pipes ("| ---" — Markout generates all table formatting).
#   - OUTPUT conformance: a regex over the REAL rendered output (verified against Markout 0.22.0)
#     asserts the exact structure — sections present/absent, columns hidden/shown, values
#     formatted, order — so an imperative over-/under-render fails while the declarative idiom lands.
config:
  max_parallel_scenarios: 2
  max_parallel_runs: 2

scenarios:

  - name: "CT01: minimal report — title + scalar field table"
    prompt: |
      This console project references a source-generated .NET serializer that projects annotated objects into Markdown (see the package reference in the .csproj). Program.cs holds
      one plain BuildReport object. Using the serializer, print a Markdown report whose H1 title is the
      project name, followed by a Field | Value table of the remaining scalar values (Configuration,
      Warnings, Errors). Drive the output through the serializer — do not hand-write the
      Markdown. Build and run the project to confirm it prints the expected report.
    setup:
      files:
        - { path: Report.csproj, source: fixtures/ct/CT01/Report.csproj }
        - { path: Program.cs,    source: fixtures/ct/CT01/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin MarkoutSerializer.Serialize .", expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin MarkoutContext .", expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "| ---" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: "(?=[\\s\\S]*# Web\\.Api)(?=[\\s\\S]*\\| Configuration \\| Release \\|)(?=[\\s\\S]*\\| Warnings \\| 3 \\|)[\\s\\S]*"
        command_timeout: 120
    rubric:
      - "Registers the model on a partial MarkoutSerializerContext and drives output through MarkoutSerializer.Serialize"
      - "Uses TitleProperty for the H1 and lets scalars render as Field | Value rows — does NOT hand-write headings or tables"
      - "Builds and prints the report"
    timeout: 900

  - name: "CT02: scalar cell formatters (number, date, bool)"
    prompt: |
      This console project references a source-generated Markdown serializer (see the .csproj).
      Program.cs holds one plain PackageInfo object. Using the serializer, print a Markdown report with an H1
      title from the package Id and a Field | Value table where:
        - Downloads is shown thousands-separated AND suffixed with the word "downloads", as one cell
          (e.g. 5,100,000,000 downloads) — the label text must be produced by the formatter, not by
          concatenating a string yourself
        - Published is shown as an ISO date (yyyy-MM-dd)
        - Signed is shown as "Yes"/"No"
      Presentation must live on the model via the serializer's formatting attributes — do NOT pre-format the
      values with inline ToString/string.Format or a ternary. Drive output through the serializer; do
      not hand-write Markdown. Build and run to confirm.
    setup:
      files:
        - { path: Report.csproj, source: fixtures/ct/CT02/Report.csproj }
        - { path: Program.cs,    source: fixtures/ct/CT02/Program.cs }
    reject_tools: [web_search, web_fetch]
    assertions:
      - { type: run_command_and_assert, command_to_run: "dotnet", command_arguments: "build", expected_exit_code: 0, command_timeout: 600 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin MarkoutSerializer.Serialize .", expected_exit_code: 0, command_timeout: 30 }
      - { type: run_command_and_assert, command_to_run: "grep", command_arguments: "-rq --include=*.cs --exclude-dir=obj --exclude-dir=bin MarkoutBoolFormat .", expected_exit_code: 0, command_timeout: 30 }
      - { type: file_not_contains, path: "Program.cs", value: "| ---" }
      - type: run_command_and_assert
        command_to_run: "dotnet"
        command_arguments: "run --no-build"
        expected_exit_code: 0
        expected_std_output_matches: "(?=[\\s\\S]*# Newtonsoft\\.Json)(?=[\\s\\S]*5,100,000,000 downloads)(?=[\\s\\S]*2023-03-08)(?=[\\s\\S]*\\| Signed \\| Yes \\|)[\\s\\S]*"
        command_timeout: 120
    rubric:
      - "Produces the Downloads cell (thousands-separated value + the word \"downloads\") through a declarative formatter — any of [MarkoutDisplayFormat(\"{0:N0} downloads\")], [MarkoutFormat] with a literal-section numeric format, or a custom IMarkoutCell + [MarkoutUnit] — plus [MarkoutBoolFormat(\"Yes\",\"No\")] for the flag and a format for the ISO date"
      - "Formatting lives on the view via attributes — does NOT inline ToString/string.Format/ternary"
      - "Drives output through the serializer; builds and prints the formatted table"
    timeout: 900

  - name: "CT03: rename and hide fields"
    prompt: |
